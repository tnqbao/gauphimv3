name: build-and-push-image

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch: { }

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale and authenticate
        run: |
          sudo tailscaled &
          sleep 3
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}
          sleep 5

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Download .env from server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" scp -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/tnqbao/.enviroment/gau-phim-frontend/clientside.env .env

      - name: Load environment variables
        id: env
        run: |
          # Load .env file and export as GitHub output
          while IFS='=' read -r key value; do
            # Skip comments and empty lines
            [[ $key =~ ^#.*$ ]] && continue
            [[ -z $key ]] && continue
            # Remove quotes if present
            value=$(echo "$value" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done < .env
        shell: bash

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: iamqbao/gau_phim_frontend:latest
          build-args: |
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ steps.env.outputs.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_USER_API=${{ steps.env.outputs.NEXT_PUBLIC_USER_API }}
            NEXT_PUBLIC_MOVIE_API=${{ steps.env.outputs.NEXT_PUBLIC_MOVIE_API }}
            NEXT_PUBLIC_API_TIMEOUT=${{ steps.env.outputs.NEXT_PUBLIC_API_TIMEOUT }}
